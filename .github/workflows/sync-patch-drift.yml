name: Sync Patch Drift (vim + tool-fix)

# Consolidated patch-drift monitor. Previously two separate workflows
# (sync-vim-pr.yml + sync-tool-fix-pr.yml) fired on the same 8h cron, each
# spinning its own runner + checkout just to hash-compare one patch. They are
# merged here into a SINGLE job (one checkout) that checks both upstream PRs in
# sequence, halving the runner/checkout overhead with no loss of monitoring.

on:
  schedule:
    # Every 8 hours, same cadence as sync-upstream.
    - cron: '0 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-patch-drift
  cancel-in-progress: true

jobs:
  check-pr-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Vim PR #12679 ---
      - name: Check if PR #12679 (vim) has changed
        id: vim
        run: |
          PR_STATE=$(gh pr view 12679 --repo anomalyco/opencode --json state --jq .state 2>/dev/null || echo "UNKNOWN")
          echo "pr_state=$PR_STATE" >> $GITHUB_OUTPUT

          if [ "$PR_STATE" = "MERGED" ]; then
            echo "PR #12679 has been merged -- vim patch may no longer be needed"
            echo "merged=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR #12679 was closed without merging"
            echo "closed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          gh pr diff 12679 --repo anomalyco/opencode > /tmp/raw-vim.patch 2>/dev/null || {
            echo "Failed to fetch PR diff"
            echo "fetch_failed=true" >> $GITHUB_OUTPUT
            exit 0
          }

          CURRENT_HASH=$(sha256sum /tmp/raw-vim.patch | cut -d' ' -f1)
          COMMITTED_HASH=$(sha256sum patches/vim.patch | cut -d' ' -f1)
          echo "Current PR diff hash:  $CURRENT_HASH"
          echo "Committed patch hash:  $COMMITTED_HASH"

          if [ "$CURRENT_HASH" != "$COMMITTED_HASH" ]; then
            echo "PR diff has changed since vim.patch was generated"
            echo "drifted=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "drifted=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create vim drift issue
        if: steps.vim.outputs.drifted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Patch drift: vim.patch no longer matches PR #12679 - review needed';
            const body = `
            ## Patch Drift Detected: vim.patch vs PR #12679

            The upstream [PR #12679](https://github.com/anomalyco/opencode/pull/12679) has been updated.
            The committed \`patches/vim.patch\` no longer matches the current PR diff.

            **This is a review signal, not a build failure.** The build continues to use the
            committed \`patches/vim.patch\` as-is. Whether that patch still applies cleanly and
            whether publication is blocked is determined by the build/release workflow, not this check.

            ### Action Required

            1. Review what changed in the PR: \`gh pr diff 12679 --repo anomalyco/opencode\`
            2. Decide whether to adopt the updated diff:
               - If yes, regenerate the patch:
                 \`\`\`bash
                 gh pr diff 12679 --repo anomalyco/opencode > patches/vim.patch
                 git add patches/vim.patch
                 git commit -m "chore: update vim.patch from PR #12679"
                 git push
                 \`\`\`
               - If no, close this issue with a note explaining why
            3. Verify the updated patch still stacks cleanly with the other local patches (run patches/apply.sh against a fresh upstream clone)
            4. Close this issue when done

            **PR**: https://github.com/anomalyco/opencode/pull/12679
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'patch-drift'
            });
            const existingIssue = issues.data.find(i => i.title.includes('PR #12679'));
            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Drift still present (${new Date().toISOString().split('T')[0]}): PR #12679 diff continues to differ from committed \`patches/vim.patch\`. Build is unaffected until manually reviewed and updated.`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['patch-drift', 'review-needed']
              });
              console.log('Created vim drift issue');
            }

      # --- Tool fix PR #16751 ---
      # `if: '!cancelled()'` so an unexpected hard failure in the vim check above
      # never silently skips the tool-fix monitoring.
      - name: Check if PR #16751 (tool fix) has changed
        id: toolfix
        if: '!cancelled()'
        run: |
          PR_STATE=$(gh pr view 16751 --repo anomalyco/opencode --json state --jq .state 2>/dev/null || echo "UNKNOWN")
          echo "pr_state=$PR_STATE" >> $GITHUB_OUTPUT

          if [ "$PR_STATE" = "MERGED" ]; then
            echo "PR #16751 has been merged -- tool fix patch may no longer be needed"
            echo "merged=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR #16751 was closed without merging"
            echo "closed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          gh pr diff 16751 --repo anomalyco/opencode > /tmp/current-tool-fix.patch 2>/dev/null || {
            echo "Failed to fetch PR diff"
            echo "fetch_failed=true" >> $GITHUB_OUTPUT
            exit 0
          }

          CURRENT_HASH=$(sha256sum /tmp/current-tool-fix.patch | cut -d' ' -f1)
          COMMITTED_HASH=$(sha256sum patches/tool-fix.patch | cut -d' ' -f1)
          echo "Current PR diff hash:  $CURRENT_HASH"
          echo "Committed patch hash:  $COMMITTED_HASH"

          if [ "$CURRENT_HASH" != "$COMMITTED_HASH" ]; then
            echo "PR diff has changed since tool-fix.patch was generated"
            echo "drifted=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "drifted=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create tool-fix drift issue
        if: steps.toolfix.outputs.drifted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Patch drift: tool-fix.patch no longer matches PR #16751 - review needed';
            const body = `
            ## Patch Drift Detected: tool-fix.patch vs PR #16751

            The upstream [PR #16751](https://github.com/anomalyco/opencode/pull/16751) has been updated.
            The committed \`patches/tool-fix.patch\` no longer matches the current PR diff.

            **This is a review signal, not a build failure.** The build continues to use the
            committed \`patches/tool-fix.patch\` as-is. Whether that patch still applies cleanly and
            whether publication is blocked is determined by the build/release workflow, not this check.

            ### Action Required

            1. Review what changed in the PR: \`gh pr diff 16751 --repo anomalyco/opencode\`
            2. Decide whether to adopt the updated diff:
               - If yes, regenerate the patch:
                 \`\`\`bash
                 gh pr diff 16751 --repo anomalyco/opencode > patches/tool-fix.patch
                 git add patches/tool-fix.patch
                 git commit -m "chore: update tool-fix.patch from PR #16751"
                 git push
                 \`\`\`
               - If no, close this issue with a note explaining why
            3. Verify the updated patch still stacks cleanly with the other local patches (run patches/apply.sh against a fresh upstream clone)
            4. Close this issue when done

            **PR**: https://github.com/anomalyco/opencode/pull/16751
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'patch-drift'
            });
            const existingIssue = issues.data.find(i => i.title.includes('PR #16751'));
            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Drift still present (${new Date().toISOString().split('T')[0]}): PR #16751 diff continues to differ from committed \`patches/tool-fix.patch\`. Build is unaffected until manually reviewed and updated.`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['patch-drift', 'review-needed']
              });
              console.log('Created tool-fix drift issue');
            }

      - name: Report status
        if: '!cancelled()'
        run: |
          echo "PR #12679 (vim) state:      ${{ steps.vim.outputs.pr_state }}  drifted=${{ steps.vim.outputs.drifted }}"
          echo "PR #16751 (tool fix) state: ${{ steps.toolfix.outputs.pr_state }}  drifted=${{ steps.toolfix.outputs.drifted }}"
