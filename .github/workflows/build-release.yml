name: Build and Release Patched OpenCode

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenCode version to build (without v prefix, e.g., 1.2.27)'
        required: true
        type: string
      revision:
        description: 'Patched revision suffix (optional; e.g. "1" → v<version>-patched.1). Use when re-releasing the same upstream version with updated patches.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write

# Prevent concurrent duplicate builds of the SAME version from racing on release
# creation. cancel-in-progress:false so an in-flight release publish is never
# killed mid-way; a duplicate dispatch queues behind the running one instead.
concurrency:
  group: build-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout opencode-patched
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone upstream opencode
        run: |
          git clone --depth 1 --branch v${{ inputs.version }} \
            https://github.com/anomalyco/opencode.git opencode-src
          cd opencode-src
          echo "Cloned opencode v${{ inputs.version }}"
          git log -1 --oneline

      - name: Apply patches
        run: |
          cd opencode-src
          ../patches/apply.sh .

      - name: Install dependencies
        run: |
          cd opencode-src
          bun install

      - name: Build CLI
        run: |
          cd opencode-src/packages/opencode
          bun run script/build.ts --all

          echo ""
          echo "Build completed. Artifacts:"
          ls -lh dist/
        env:
          OPENCODE_VERSION: ${{ inputs.version }}

      - name: Extract Linux arm64 binary
        run: |
          cd opencode-src/packages/opencode/dist/opencode-linux-arm64
          tar czf /tmp/opencode-linux-arm64.tar.gz .
          echo "Created: $(ls -lh /tmp/opencode-linux-arm64.tar.gz)"

      - name: Extract Linux x64 binary
        run: |
          cd opencode-src/packages/opencode/dist/opencode-linux-x64
          tar czf /tmp/opencode-linux-x64.tar.gz .
          echo "Created: $(ls -lh /tmp/opencode-linux-x64.tar.gz)"

      - name: Upload Linux arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-arm64
          path: /tmp/opencode-linux-arm64.tar.gz
          retention-days: 1

      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64
          path: /tmp/opencode-linux-x64.tar.gz
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout opencode-patched
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone upstream opencode
        run: |
          git clone --depth 1 --branch v${{ inputs.version }} \
            https://github.com/anomalyco/opencode.git opencode-src
          cd opencode-src
          echo "Cloned opencode v${{ inputs.version }}"
          git log -1 --oneline

      - name: Apply patches
        run: |
          cd opencode-src
          ../patches/apply.sh .

      - name: Install dependencies
        run: |
          cd opencode-src
          bun install

      - name: Build CLI
        run: |
          cd opencode-src/packages/opencode
          bun run script/build.ts --all

          echo ""
          echo "Build completed. Artifacts:"
          ls -lh dist/
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          # Bun 1.3.12 has a regression (oven-sh/bun#29120, fixed in #29272)
          # where its built-in Mach-O codesigner writes an LC_CODE_SIGNATURE
          # with datasize smaller than the SuperBlob it actually stamps. macOS
          # kernels (Sequoia 15.4+) SIGKILL the resulting binary on launch,
          # and subsequent `codesign --sign -` calls fail with "invalid or
          # unsupported format for signature".
          #
          # Disable Bun's internal signer so the output has no LC_CODE_SIGNATURE
          # slot at all, then ad-hoc sign it ourselves below. Remove this env
          # var once Bun >1.3.12 ships.
          BUN_NO_CODESIGN_MACHO_BINARY: "1"

      # Ad-hoc sign the freshly-built Mach-O binaries. Without a valid
      # signature, macOS (Apple Silicon, Sequoia 15.4+) SIGKILLs the binary
      # on launch with exit 9. We do this ourselves because Bun's internal
      # signer is disabled via BUN_NO_CODESIGN_MACHO_BINARY above.
      - name: Ad-hoc codesign macOS binaries
        run: |
          for arch in arm64 x64; do
            bin="opencode-src/packages/opencode/dist/opencode-darwin-${arch}/bin/opencode"
            echo "Signing ${bin}"
            codesign --force --sign - "${bin}"
            codesign -dv "${bin}" 2>&1 | grep -E "^(Executable|Signature|Format|CodeDirectory)"
          done

      - name: Smoke test signed arm64 binary
        run: |
          bin="opencode-src/packages/opencode/dist/opencode-darwin-arm64/bin/opencode"
          "${bin}" --version

      - name: Extract macOS arm64 binary
        run: |
          cd opencode-src/packages/opencode/dist/opencode-darwin-arm64
          zip -r /tmp/opencode-darwin-arm64.zip .
          echo "Created: $(ls -lh /tmp/opencode-darwin-arm64.zip)"

      - name: Extract macOS x64 binary
        run: |
          cd opencode-src/packages/opencode/dist/opencode-darwin-x64
          zip -r /tmp/opencode-darwin-x64.zip .
          echo "Created: $(ls -lh /tmp/opencode-darwin-x64.zip)"

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-darwin-arm64
          path: /tmp/opencode-darwin-arm64.zip
          retention-days: 1

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-darwin-x64
          path: /tmp/opencode-darwin-x64.zip
          retention-days: 1

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release tag
        id: tag
        run: |
          # Tag is v<version>-patched[.<revision>]. Empty revision keeps the
          # legacy single-release-per-version naming; non-empty appends ".N"
          # so re-releases of the same upstream version (e.g. when a new
          # patch lands without an upstream version bump) don't collide.
          REV='${{ inputs.revision }}'
          if [ -z "$REV" ]; then
            TAG="v${{ inputs.version }}-patched"
          else
            TAG="v${{ inputs.version }}-patched.${REV}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          # Only pull the FINAL release assets (opencode-*). Any intermediate
          # artifacts (e.g. unsigned-darwin-*) are excluded so merge-multiple
          # can never clobber a signed binary with an unsigned one.
          pattern: opencode-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.sha256
          cat checksums.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OpenCode v${{ inputs.version }} with Local Patches${{ inputs.revision && format(' (rev .{0})', inputs.revision) || '' }}
          body: |
            # OpenCode v${{ inputs.version }} with Local Patches

            This release applies six patches to OpenCode v${{ inputs.version }}:

            1. **Gemini empty parts fix** from [PR #28669](https://github.com/anomalyco/opencode/pull/28669)
            2. **Tool use/result mismatch fix** from [PR #16751](https://github.com/anomalyco/opencode/pull/16751)
            3. **Cache thinking-skip** for [Issue #17883](https://github.com/anomalyco/opencode/issues/17883) -- when marking the conversation cache breakpoint, scan backwards to the last *cacheable* content block instead of `content[length-1]`, so `cache_control` never lands on a trailing reasoning/thinking block (which Anthropic rejects with HTTP 400).
            4. **Retry cap** (local) -- caps model-stream retries at `MAX_RETRIES = 8` and adds downward-only backoff jitter to prevent thundering herd conditions.
            5. **Vim keybindings** from [PR #12679](https://github.com/anomalyco/opencode/pull/12679)
            6. **SQLite foreign key wrapping** (local) -- recursively inspects database exceptions to correctly capture nested constraint failures on modern effect-drizzle error structures.

            Note: As of 2026-06-02, the big **caching.patch** (formerly fetched from [opencode-cached](https://github.com/johnnymo87/opencode-cached), PR #5422) is DROPPED. Upstream `applyCaching` already implements the moving-tail conversation anchor (`non-system.slice(-2)`), making the fork patch redundant; the only behavior upstream lacked (skipping reasoning blocks at the cache breakpoint) is preserved as the small `cache-thinking-skip.patch` above. As of v1.15.10, the bus-eager-subscribe patch (PR #27959) and the bus instance-context fix (PR #28051) are DROPPED -- both are upstream-merged in v1.15.5+.

            ## Gemini Empty Parts Fix

            Pads completely empty Gemini user, assistant, or tool messages with an empty string text part before request serialization. This avoids Vertex/Gemini rejecting `parts: []` with `Unable to submit request because it must include at least one parts field`.

            ## Vim Keybindings

            Enable with `tui.vim: true` in config or toggle from command palette. Disabled by default.

            - Mode switching: `i I a A o O S`, `cc`, `cw`, `Esc`
            - Motions: `h j k l`, `w b e`, `W B E`, `0 ^ $`
            - Deletes: `x`, `dd`, `dw`
            - Session navigation: `gg/G`
            - Scrolling: `Ctrl+e/y/d/u/f/b`
            - `Enter` in normal mode submits

            ## Tool Use/Result Mismatch Fix

            Fixes the widespread `tool_use ids were found without tool_result blocks` error ([#16749](https://github.com/anomalyco/opencode/issues/16749)) that corrupts sessions when stream errors cause lost step boundaries. Injects synthetic step-start boundaries at reconstruction time to prevent interleaved tool_use/text in assistant messages.

            ## Retry Cap

            Caps model-stream retries at `MAX_RETRIES = 8` and adds downward-only backoff jitter.

            ## Installation

            ### Linux (arm64)
            ```bash
            curl -sL https://github.com/johnnymo87/opencode-patched/releases/download/${{ steps.tag.outputs.tag }}/opencode-linux-arm64.tar.gz | tar xz
            ./bin/opencode --version
            ```

            ### Linux (x64)
            ```bash
            curl -sL https://github.com/johnnymo87/opencode-patched/releases/download/${{ steps.tag.outputs.tag }}/opencode-linux-x64.tar.gz | tar xz
            ./bin/opencode --version
            ```

            ### macOS (arm64)
            ```bash
            curl -sL https://github.com/johnnymo87/opencode-patched/releases/download/${{ steps.tag.outputs.tag }}/opencode-darwin-arm64.zip -o opencode.zip && unzip opencode.zip
            ./bin/opencode --version
            ```

            ### macOS (x64)
            ```bash
            curl -sL https://github.com/johnnymo87/opencode-patched/releases/download/${{ steps.tag.outputs.tag }}/opencode-darwin-x64.zip -o opencode.zip && unzip opencode.zip
            ./bin/opencode --version
            ```

            ---

            **Upstream**: [anomalyco/opencode v${{ inputs.version }}](https://github.com/anomalyco/opencode/releases/tag/v${{ inputs.version }})
            **Gemini empty parts patch**: [PR #28669](https://github.com/anomalyco/opencode/pull/28669)
            **Tool fix patch**: [PR #16751](https://github.com/anomalyco/opencode/pull/16751)
            **Cache thinking-skip**: [Issue #17883](https://github.com/anomalyco/opencode/issues/17883) (local patch; caching.patch dropped, see note above)
            **Retry cap**: local patch
            **Vim patch**: [PR #12679](https://github.com/anomalyco/opencode/pull/12679)
          files: |
            artifacts/opencode-linux-arm64.tar.gz
            artifacts/opencode-linux-x64.tar.gz
            artifacts/opencode-darwin-arm64.zip
            artifacts/opencode-darwin-x64.zip
            artifacts/checksums.sha256
          # Fail loudly if any expected asset is missing rather than publishing a
          # release silently short a platform (default is warn-and-continue).
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-on-failure:
    needs: [build-linux, build-macos, release]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ inputs.version }}';
            const title = `Build failed for v${version}`;
            const body = `
            ## Build Failure: v${version}

            The automated build for OpenCode v${version} with local patches failed.

            **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            > **Automatic builds for v${version} are PAUSED while this issue is open.**
            > The scheduled \`sync-upstream\` workflow treats an open \`build-failure\`
            > issue for this version as a circuit breaker and will not re-trigger the
            > build every 8h. **Close this issue after fixing the patches to re-enable
            > auto-builds**, or manually dispatch \`build-release.yml\` to retry now.

            ### Possible Causes

            1. **Gemini empty parts patch conflict**: The local gemini-empty-parts.patch may not apply to v${version}
            2. **Tool fix patch conflict**: The local tool-fix.patch may not apply to v${version}
            3. **Cache thinking-skip patch conflict**: The local cache-thinking-skip.patch may not apply to v${version} (it targets \`applyCaching\` in \`provider/transform.ts\`; if upstream refactored that function, re-derive the backward-scan hunk)
            4. **Retry cap patch conflict**: The local retry-cap.patch may not apply to v${version}
            5. **Vim patch conflict**: The local vim.patch may not apply to v${version}
            6. **Build failure**: OpenCode build process may have changed

            ### Action Required

            1. Check the workflow logs above
            2. If the cache thinking-skip patch failed, re-derive it against upstream \`applyCaching\` (see [Issue #17883](https://github.com/anomalyco/opencode/issues/17883)) -- the patch just makes the breakpoint scan backwards past reasoning/thinking blocks
            3. If vim patch failed, regenerate from [PR #12679](https://github.com/anomalyco/opencode/pull/12679):
               \`\`\`bash
               gh pr diff 12679 --repo anomalyco/opencode > patches/vim.patch
               # Review changes, filter if needed, commit and push
               \`\`\`
            4. If tool fix patch failed, regenerate from [PR #16751](https://github.com/anomalyco/opencode/pull/16751):
               \`\`\`bash
               gh pr diff 16751 --repo anomalyco/opencode > patches/tool-fix.patch
               # Review changes, commit and push
               \`\`\`
            5. If retry cap patch failed, review upstream changes to \`session/retry.ts\` and update manually
            6. Re-run: \`gh workflow run build-release.yml --field version=${version}\` (or add \`--field revision=N\` to re-release the same upstream version with updated patches; the release tag becomes \`v${version}-patched.N\`)
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-failure'
            });

            const existingIssue = issues.data.find(i => i.title === title);

            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Another build failure occurred. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n_Automatic builds for v${version} remain paused while this issue is open (sync-upstream circuit breaker). Close it after fixing the patches to re-enable auto-builds._`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['build-failure', 'automated']
              });
              console.log('Created issue: ' + title);
            }
